[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=1
autonogc=1
updater2p=1
{}

[虚拟系统-带中文路径支持]
pkg3=atmosphere/package3
emummcforce=1
cal0blank=1
fsoverlay=bootloader/fsoverlays/fs_codecvt_dual_unpacked.kip
logopath=bootloader/bootlogo2.bmp
icon=bootloader/res/emunand.bmp
id=Atm-Emu
usb3force=1

[虚拟系统-不带中文路径支持]
pkg3=atmosphere/package3
emummcforce=1
cal0blank=1
logopath=bootloader/bootlogo2.bmp
icon=bootloader/res/emunand.bmp
id=Atm-Emu
usb3force=1


[正版系统]
fss0=atmosphere/package3
emummc_force_disable=1
stock=1
icon=bootloader/res/switch.bmp
id=OFW-SYS
